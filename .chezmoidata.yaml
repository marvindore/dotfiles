profile: "home"

# SilverBullet. Override in ~/.config/chezmoi/chezmoi.toml.
# Work: local server, notes folder on disk. Home: URL of the homelab server.
silverbulletSpacePath: "$HOME/notes"
silverbulletUrl: "<place_holder>"

work:
  org_slug: "<place_holder>"
  email: "<place_holder>"

ssh:
  # If true on macOS, include Colima’s SSH config (safe to leave true at work).
  enable_colima_include: true

  # Keys (override here if you use different paths)
  homeKey: "~/.ssh/home"
  workKey: "~/.ssh/work"
